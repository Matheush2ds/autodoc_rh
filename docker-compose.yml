# Compose de PRODUCAO (usado pelo Coolify).
# Nao adicione bind mounts de codigo aqui: o codigo vem de dentro da imagem.
# Para desenvolvimento local use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    build: .
    restart: unless-stopped
    # O proxy do Coolify roteia o dominio para esta porta interna.
    # Se quiser acessar direto pela porta do host, descomente "ports" abaixo.
    expose:
      - "5000"
    # ports:
    #   - "5000:5000"
    environment:
      - TEMPLATES_DIR=/app/docx_templates
      - OUTPUT_DIR=/app/generated_docs
      - DB_FILE=/app/data/log.db
      - SECRET_KEY=${SECRET_KEY:-troque-este-segredo}
    volumes:
      # Apenas dados persistentes (volumes nomeados, gerenciados pelo Docker).
      - autodoc_data:/app/data
      - autodoc_docs:/app/generated_docs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  autodoc_data:
  autodoc_docs:
