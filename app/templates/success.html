{% extends "base.html" %}
{% block content %}
<div class="container" style="text-align: center; margin-top: 50px;">
    <div class="card" style="padding: 40px; display: inline-block;">
        <i class="fas fa-check-circle" style="font-size: 60px; color: #28a745; margin-bottom: 20px;"></i>
        <h1 class="page-title">Documentos Gerados!</h1>
        <p style="margin-bottom: 30px;">Seu arquivo está pronto para ser baixado.</p>
        
        {% if filename %}
            <a href="{{ url_for('download', filename=filename) }}" class="submit-btn" style="text-decoration: none;">
                <i class="fas fa-download"></i> Baixar Arquivos (.zip)
            </a>
        {% else %}
            <p class="text-danger">Ocorreu um erro: nome do arquivo não encontrado.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
